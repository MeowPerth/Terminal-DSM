# terminal-dsm 的 tmux 配置
# 交互式 bash + 自定义提示符（显示当前目录）
set-option -g default-command "bash --rcfile /var/packages/terminal/target/etc/terminal_bashrc -i"
set-option -g history-limit 50000
set-option -g mouse on
set-option -g set-clipboard on
set-option -g base-index 1
set-option -g renumber-windows on
set-option -g escape-time 10
set-option -g focus-events on
set-option -g status-position top
set-option -g status-style "bg=green,fg=black"

# 只保留工具栏用到的三个动作；其余 prefix 快捷键全部解绑。
unbind -a
bind % split-window -h
bind '"' split-window -v
bind x kill-pane
bind C-b send-prefix
