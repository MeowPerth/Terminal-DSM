<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Terminal</title>
  <link rel="stylesheet" href="/terminal/assets/xterm.css?__VER__" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1e1e1e; }
    body { display: flex; flex-direction: column; }

    #bar {
      flex: 0 0 auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      padding: 4px 6px; background: #252526; border-bottom: 1px solid #3a3a3a;
      font: 12px/1.4 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #ccc;
      user-select: none;
    }
    #bar button {
      appearance: none; border: 1px solid #3f3f46; background: #2f2f33; color: #ddd;
      border-radius: 4px; padding: 3px 8px; font: inherit; cursor: pointer; white-space: nowrap;
    }
    #bar button:hover { background: #3a3a40; border-color: #4d4d55; }
    #bar button:active { background: #454550; }
    #bar button { display: inline-flex; align-items: center; gap: 5px; }
    #bar button svg { width: 14px; height: 14px; flex: 0 0 auto; }
    #bar button svg rect, #bar button svg path { fill: none; stroke: currentColor; stroke-width: 1.3; }
    #bar button svg .fill { fill: currentColor; stroke: none; opacity: .85; }
    #bar .sep { width: 1px; height: 16px; background: #3f3f46; margin: 0 2px; }
    #bar .grow { flex: 1 1 auto; }
    #bar input#fontsize {
      width: 34px; flex: 0 0 auto; text-align: center; background: #1e1e1e; color: #ddd;
      border: 1px solid #3f3f46; border-radius: 4px; padding: 2px 0; font: inherit;
    }

    #terminal { flex: 1 1 auto; position: relative; padding: 2px 0 0 2px; box-sizing: border-box; overflow: hidden; }

    #toast {
      position: fixed; right: 14px; bottom: 14px; z-index: 20;
      padding: 6px 12px; border-radius: 6px; font: 13px/1.4 -apple-system, "Segoe UI", sans-serif;
      color: #fff; background: rgba(46, 160, 67, .94); opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }

    #overlay {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, .65); color: #ddd; font: 14px/1.6 -apple-system, "Segoe UI", sans-serif;
      z-index: 9; cursor: pointer;
    }
    #overlay.show { display: flex; }

    /* 帮助 / 确认 弹层 */
    .modal {
      position: fixed; inset: 0; z-index: 12; display: none;
      align-items: center; justify-content: center; background: rgba(0, 0, 0, .6);
    }
    .modal.show { display: flex; }
    .modal .box {
      max-width: 380px; max-height: 80vh; overflow: auto;
      background: #252526; color: #ddd; border: 1px solid #3a3a3a; border-radius: 8px;
      padding: 12px 16px; font: 12.5px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    }
    .modal h3 { margin: 0 0 8px; font-size: 14px; color: #fff; }
    .modal table { border-collapse: collapse; width: 100%; }
    .modal td { padding: 1px 10px 1px 0; vertical-align: top; white-space: nowrap; }
    .modal code { background: #333; border-radius: 3px; padding: 0 4px; }
    .modal .hint { color: #8b8b8b; margin-top: 8px; font-size: 11.5px; }
    .modal .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .modal .btns button {
      appearance: none; border: 1px solid #3f3f46; background: #2f2f33; color: #ddd;
      border-radius: 4px; padding: 5px 14px; font: inherit; cursor: pointer;
    }
    .modal .btns button:hover { background: #3a3a40; }
    .modal .btns button.danger { background: #a33; border-color: #c44; color: #fff; }
    .modal .btns button.danger:hover { background: #c44; }

    /* 全局零宽滚动条：xterm 初始化时按“测量到的滚动条宽度”预留列宽，
       如果只隐藏 viewport 的滚动条，它会白白预留约 14px，导致右侧留空。 */
    ::-webkit-scrollbar { width: 0; height: 0; }
    * { scrollbar-width: none; -ms-overflow-style: none; }
    .xterm .xterm-viewport { scrollbar-width: none; -ms-overflow-style: none; }
    .xterm .xterm-viewport::-webkit-scrollbar { width: 0; height: 0; }
  </style>
</head>

<body>
  <div id="bar">
    <button data-font="-" title="减小字号">A−</button>
    <input id="fontsize" value="14" readonly title="当前字号" />
    <button data-font="+" title="增大字号">A+</button>
    <span class="sep"></span>
    <button data-act="split-h" title="左右分屏（Ctrl+B %）">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.6" y="2.6" width="12.8" height="10.8" rx="1.6"/><path d="M8 2.6v10.8" class="ln"/><rect x="2.4" y="3.4" width="4.9" height="9.2" rx="0.8" class="fill"/></svg>
      左右分屏</button>
    <button data-act="split-v" title="上下分屏（Ctrl+B &quot;）">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.6" y="2.6" width="12.8" height="10.8" rx="1.6"/><path d="M1.6 8h12.8" class="ln"/><rect x="2.4" y="3.4" width="11.2" height="3.9" rx="0.8" class="fill"/></svg>
      上下分屏</button>
    <button data-act="kill-pane" title="关闭当前窗格（Ctrl+B x）">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.6" y="2.6" width="12.8" height="10.8" rx="1.6"/><path d="M5.6 5.6l4.8 4.8M10.4 5.6l-4.8 4.8" class="ln"/></svg>
      关闭窗格</button>
    <span class="sep"></span>
    <button data-act="help" title="快捷键帮助">? 帮助</button>
    <span class="grow"></span>
  </div>

  <div id="terminal"></div>

  <div id="toast"></div>
  <div id="overlay"><div>连接已断开，点击重新连接</div></div>

  <div id="help" class="modal"><div class="box">
    <h3>快捷键</h3>
    <table>
      <tr><td>左右分屏</td><td><code>Ctrl+B %</code></td></tr>
      <tr><td>上下分屏</td><td><code>Ctrl+B "</code></td></tr>
      <tr><td>关闭窗格</td><td><code>Ctrl+B x</code> 再按 <code>y</code></td></tr>
      <tr><td>切换窗格</td><td>鼠标左键点击对应窗格</td></tr>
      <tr><td>复制</td><td>拖选自动复制，或 <code>Ctrl+Shift+C</code></td></tr>
      <tr><td>粘贴</td><td><code>Ctrl+Shift+V</code>，或右键菜单</td></tr>
    </table>
    <div class="hint">Ctrl+B 为前缀键 · 按 Esc 或点击空白处关闭</div>
  </div></div>

  <div id="confirm" class="modal"><div class="box">
    <h3>确认</h3>
    <div id="confirm-text">确定要执行该操作吗？</div>
    <div class="btns">
      <button id="confirm-cancel">取消</button>
      <button id="confirm-ok" class="danger">确定</button>
    </div>
  </div></div>

  <script src="/terminal/assets/xterm.js?__VER__"></script>
  <script src="/terminal/assets/addon-fit.js?__VER__"></script>
  <script src="/terminal/assets/app.js?__VER__"></script>
</body>

</html>
